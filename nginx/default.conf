# =====================================================================
# COSMOOSS — Nginx configuration (production, frontend only)
# ---------------------------------------------------------------------
# Serves the React/Vite static build. No backend, no proxy. The browser
# talks to Supabase directly (Auth/PostgreSQL/Storage). Nothing private is
# proxied or cached here.
# =====================================================================

# ---------------------------------------------------------------------
# Bot detection for prerendered product pages.
# Crawlers/social scrapers (Googlebot, Facebook, WhatsApp, Twitter…)
# receive the build-time static HTML at /produit/:slug →
# /prerendered/produit/:slug/index.html (full metadata + JSON-LD).
# Regular browsers get the React SPA (meta refresh inside the static
# HTML handles bots that skip JS; browsers are redirected to /produit/:slug
# and hydrate the real product page).
# ---------------------------------------------------------------------
map $http_user_agent $serves_prerendered_product {
    default 0;
    ~*facebookexternalhit 1;
    ~*facebot 1;
    ~*twitterbot 1;
    ~*whatsapp 1;
    ~*telegrambot 1;
    ~*linkedinbot 1;
    ~*googlebot 1;
    ~*pinterest 1;
    ~*slackbot 1;
    ~*discordbot 1;
    ~*discord 1;
    ~*slack 1;
    ~*vkShare 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
}

server {
    listen 80;
    server_name _;

    # Hide nginx version from response headers/error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP, nosniff, frame/ref/permissions).
    # Included at server level AND in each location that sets its own
    # add_header — Nginx drops inherited add_header directives in any
    # location that declares its own.
    include /etc/nginx/conf.d/security-headers.inc;

    # ---------------------------------------------------------------
    # Gzip — text assets only. Images (jpg/jpeg/png/webp/avif) and
    # woff2 are already compressed and must NOT be gzipped again.
    # ---------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;
        # NOTE: text/html is intentionally omitted — nginx gzips it by default
        # (listing it again triggers a "duplicate MIME type" warning).

    # ---------------------------------------------------------------
    # Hashed static assets (Vite emits assets/*-HASH.js|css|fonts...).
    # Content-addressed URLs → immutable, cache 1 year.
    # ---------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # index.html — NEVER immutable. no-cache forces the browser to
    # revalidate on every load so a new deployment's asset hashes are
    # picked up immediately.
    # ---------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Short-lived cache for small public root assets (favicon, robots, sitemap).
    location ~* ^/(favicon-app\.svg|robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # Health check for the load balancer / orchestrator.
    # Fast, static, 200 while Nginx is up. NO Supabase dependency:
    # a frontend container's health must not depend on backend
    # availability. No cache — the LB must always hit the origin.
    # ---------------------------------------------------------------
    location = /health {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # Prerendered product pages — SEO.
    # Bots get the build-time static HTML (/prerendered/produit/<slug>/
    # index.html) directly for the public URL /produit/<slug> via an
    # internal redirect (`last`) to the /prerendered/ location below.
    # Real 404 if the file is missing — a nonexistent product can never
    # become a soft-404 indexable page (no fallback to index.html).
    # Browsers (non-bot) skip the redirect and reach the SPA via
    # try_files → /index.html → React hydrates the real 404 noindex.
    # ---------------------------------------------------------------
    location ~ ^/produit/([^/]+)/?$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        if ($serves_prerendered_product = 1) {
            rewrite ^/produit/([^/]+)/?$ /prerendered/produit/$1/index.html last;
        }
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # Build-time prerendered static pages (SEO).
    # Static files only, never a fallback: an unknown /prerendered/...
    # path returns a real 404. These files are only reachable via the
    # internal redirect from /produit/:slug for bots (or by direct URL,
    # which is harmless — same public HTML).
    # ---------------------------------------------------------------
    location /prerendered/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # SPA routing.
    # - Existing files (hashed assets, prerendered /produit/*/index.html)
    #   are served directly.
    # - Everything else falls back to index.html so that refreshing
    #   /produits, /produit/:slug, /admin, /admin/produits, etc. never
    #   returns 404.
    # ---------------------------------------------------------------
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (e.g. accidental .env copy). Must stay AFTER
    # the /assets/ location so hashed assets with dots are not matched.
    location ~ /\.(?!well-known) {
        include /etc/nginx/conf.d/security-headers.inc;
        deny all;
    }
}
