<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0a0b8" />
    <title>Cosmooss — Produits cosmétiques au Maroc</title>
    <meta name="description" content="Boutique de cosmétiques naturels et bio au Maroc. Découvrez notre sélection de soins visage, corps, cheveux, maquillage et parfums." />
    <meta name="author" content="Cosmooss" />

    <!-- Open Graph par défaut (chaque page surcharge via useSeo) -->
    <meta property="og:title" content="Cosmooss — Produits cosmétiques au Maroc" />
    <meta property="og:description" content="Cosmétiques naturels et bio au Maroc. Soins visage, corps, cheveux, maquillage et parfums." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_MA" />
    <meta property="og:site_name" content="Cosmooss" />
    <!-- Image par défaut (les robots d'aperçu social n'exécutent pas le JS : l'URL
         doit être absolue ici, sinon aucun aperçu de partage pour le site). -->
    <meta property="og:image" content="https://cosmooss.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://cosmooss.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Cosmooss — cosmétiques naturels et bio au Maroc" />

    <!-- Twitter Card (aucun compte social vérifié → pas de twitter:site inventé) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cosmooss.com/og-image.png" />
    <meta name="twitter:image:alt" content="Cosmooss — cosmétiques naturels et bio au Maroc" />

    <link rel="icon" type="image/svg+xml" href="/favicon-app.svg?v=1" />
    <link rel="shortcut icon" href="/favicon-app.svg?v=1" />
    <link rel="apple-touch-icon" href="/favicon-app.svg?v=1" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
